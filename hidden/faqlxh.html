<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../favicon.ico">
<title>Jungle Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width:100%; height:100%; overflow:hidden; background:#040a05; }

  /* ─────────────────────────────────────────────────────────
     Z-INDEX MAP (low → high)
       1  : .landing       (the destination page, always behind)
       2  : .vignette      (darkness overlay on landing)
       3  : .light-beam    (glow tunnel)
      11  : .panel-r1      (right — exits second)
      13  : .panel-l1      (left  — exits first)
      20  : .particles
     ───────────────────────────────────────────────────────── */

  /* ─── LANDING PAGE ──────────────────────────────────────── */
  .landing {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 58%,
      #d4f0c4 0%, #a8d890 28%, #6db87a 55%, #2d6e40 100%);
    filter: brightness(0) blur(14px);
    transition: filter 1.4s ease;
  }
  .landing.lit { filter: brightness(1) blur(0); }

  .landing-content {
    text-align: center; opacity: 0; transform: translateY(22px);
    transition: opacity 1.1s cubic-bezier(0.22,1,0.36,1),
                transform 1.1s cubic-bezier(0.22,1,0.36,1);
  }
  .landing-content.visible { opacity:1; transform:translateY(0); }

  .landing h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 7vw, 6rem);
    font-style: italic; color: #0a1a0d;
    letter-spacing: -0.02em; line-height: 1.05;
  }
  .landing-deco { width:60px; height:1px; background:#2d6e40; margin:1.4rem auto; }
  .landing p {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1rem,2.2vw,1.4rem); font-weight:300; color:#1a4a24;
    letter-spacing:0.28em; text-transform:uppercase;
  }

  /* ─── VIGNETTE ──────────────────────────────────────────── */
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse 46% 36% at 50% 55%,
      transparent 0%, rgba(3,9,4,0.5) 50%, rgba(1,4,2,0.97) 100%);
    opacity: 1;
    transition: opacity 2s ease;
  }
  .vignette.out { opacity: 0; }

  /* ─── LIGHT BEAM ────────────────────────────────────────── */
  .light-beam {
    position: fixed; left: 50%; top: 0;
    width: 2px; height: 100%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse 55% 50% at 50% 58%,
      rgba(255,250,220,0.9) 0%, rgba(210,255,170,0.5) 38%,
      rgba(80,190,90,0.12) 68%, transparent 100%);
    z-index: 3; pointer-events: none;
    opacity: 0;
    transition: width 3s ease, opacity 0.6s ease;
  }
  .light-beam.glow {
    width: 80vw; opacity: 0.5;
  }
  .light-beam.out {
    width: 100vw; opacity: 0;
  }

  /* ─── PANELS ────────────────────────────────────────────── */
  .panel {
    position: fixed; inset: 0;
    overflow: hidden;
    /* panels are ALWAYS in place until .slide class applied */
    transition: transform 2s cubic-bezier(0.76, 0, 0.24, 1);
  }
  .panel svg { width:100%; height:100%; display:block; }

  /* Stacking: l1 on top, r1 underneath */
  .panel-l1 { z-index: 13; }
  .panel-r1 { z-index: 11; transform: scaleX(-1); }

  /* slide-out classes added by JS */
  .panel-l1.slide { transform: translateX(-100%); }
  .panel-r1.slide { transform: scaleX(-1) translateX(-100%); }

  /* ─── PARTICLES ─────────────────────────────────────────── */
  .particle {
    position: fixed; border-radius: 50% 0 50% 0;
    pointer-events: none; z-index: 20; opacity: 0;
    animation: particleDrift linear forwards;
  }
  @keyframes particleDrift {
    0%  { opacity: 1; transform: translate(0,0) rotate(0deg); }
    100%{ opacity: 0; transform: translate(var(--dx), 88vh) rotate(var(--dr)); }
  }

  .p1{left:14%;top:-1%;width:9px; height:6px; background:#3a8a4a;animation-duration:2s;  --dx:-35px;--dr:210deg;}
  .p2{left:28%;top:-2%;width:6px; height:10px;background:#2d7a3e;animation-duration:2.4s;--dx:22px; --dr:-155deg;}
  .p3{right:18%;top:-2%;width:8px; height:6px; background:#3d9450;animation-duration:2s;  --dx:38px; --dr:195deg;}
  .p4{right:32%;top:2%; width:10px;height:6px; background:#5abf6e;animation-duration:2.4s;--dx:-28px;--dr:-215deg;}
</style>
</head>
<body>

<!-- z:1 — destination page -->

  <div class="landing-content">
    <h1>Into the Wild</h1>
    <div class="landing-deco"></div>

  </div>
</div>

<!-- z:20 — particles -->
<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>

<script>
  const SLIDE = 2000;  // ms — matches CSS transition: 2s
  const GAP   = 500;   // ms — gap between panels
  const t0    = 300;   // ms — initial pause

  const l1      = document.getElementById('l1');
  const r1      = document.getElementById('r1');
  const beam    = document.querySelector('.light-beam');
  const vignette = document.querySelector('.vignette');
  const landing  = document.querySelector('.landing');
  const content  = document.querySelector('.landing-content');
  const particles = document.querySelectorAll('.particle');

  function fireParticles(ids) {
    ids.forEach(i => {
      const p = particles[i];
      p.style.animationName = 'none';
      requestAnimationFrame(() => requestAnimationFrame(() => { p.style.animationName = ''; }));
    });
  }

  // Beam glows on load
  setTimeout(() => beam.classList.add('glow'), t0);

  // L1 exits first
  setTimeout(() => {
    l1.classList.add('slide');
    fireParticles([0, 1]);
    landing.style.transition = 'filter 6s ease';
    landing.style.filter = 'brightness(0.3) blur(8px)';
  }, t0);

  // R1 exits second (after L1 finishes + gap)
  setTimeout(() => {
    r1.classList.add('slide');
    fireParticles([2, 3]);
    landing.style.filter = 'brightness(0.7) blur(2px)';
    beam.classList.add('out');
    vignette.classList.add('out');
  }, t0 + SLIDE + GAP);

  // Full brightness + content after R1 clears
  setTimeout(() => {
    landing.style.transition = 'filter 1s ease';
    landing.style.filter = 'brightness(1) blur(0)';
    content.classList.add('visible');
  }, t0 + SLIDE + GAP + SLIDE + 200);
</script>
